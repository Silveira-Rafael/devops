name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Análise estática (flake8)
        run: flake8 app tests

      - name: Executar testes automatizados com cobertura
        run: coverage run -m unittest discover -s tests -t . -v

      - name: Exigir cobertura mínima de 80%
        run: coverage report --fail-under=80

      - name: Gerar relatório de cobertura (XML)
        run: coverage xml

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  docker-build:
    name: Build da imagem Docker e smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t task-api:ci .

      - name: Subir o contêiner e testar o endpoint /health
        run: |
          docker run -d --name task-api -p 8000:8000 task-api:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break || sleep 1
          done
          curl -fsS http://localhost:8000/health
          docker logs task-api

  terraform-validate:
    name: Validar scripts do Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend remoto)
        run: terraform init -backend=false -input=false

      - name: Validar configuração
        run: terraform validate
