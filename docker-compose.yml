# Orquestração da Task API com Docker Compose (ambiente local e de teste).

name: task-api

services:
  api:
    image: ${IMAGE:-task-api}:${TAG:-local}
    build: .
    container_name: task-api
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
